<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết Quả Thanh Toán - Celesté House</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/payment-custom.css">
</head>
<body>

<nav>
    <div class="logo">CELESTÉ HOUSE</div>
    <ul class="nav-links">
        <li><a href="../index.html">Trang Chủ</a></li>
        <li><a href="./menu.html">Thực Đơn</a></li>
        <li><a href="./team.html">Nhà Hàng</a></li>
        <li><a href="./booking.html">Đặt Bàn</a></li>
        <li><a href="./blog.html">Blog</a></li>
        <li><a href="./contact.html">Liên Hệ</a></li>
    </ul>
</nav>

<!-- Progress Bar -->
<div class="progress-bar-wrap">
    <div class="progress-steps">
        <div class="step done">
            <div class="step-num"><span class="material-symbols-outlined" style="font-size:13px">check</span></div>
            <span>Thông tin</span>
        </div>
        <div class="step-line done"></div>
        <div class="step done">
            <div class="step-num"><span class="material-symbols-outlined" style="font-size:13px">check</span></div>
            <span>Chọn bàn</span>
        </div>
        <div class="step-line done"></div>
        <div class="step done">
            <div class="step-num"><span class="material-symbols-outlined" style="font-size:13px">check</span></div>
            <span>Thanh toán</span>
        </div>
        <div class="step-line done" id="step-line-4"></div>
        <div class="step active" id="step-4">
            <div class="step-num" id="step-4-num">4</div>
            <span>Xác nhận</span>
        </div>
    </div>
</div>

<!-- Result Card -->
<div class="result-container">
    <div class="result-card" id="result-card">

        <!-- Icon — đổi theo kết quả -->
        <div class="result-icon" id="result-icon">
            <span class="material-symbols-outlined" id="result-icon-symbol">hourglass_top</span>
        </div>

        <h2 class="result-title" id="result-title">Đang xử lý...</h2>
        <p class="result-subtitle" id="result-subtitle">Vui lòng chờ trong giây lát.</p>

        <!-- Detail rows -->
        <div class="result-details" id="result-details" style="display:none;">
            <div class="result-row">
                <span class="result-label">Mã giao dịch VNPay</span>
                <span class="result-value" id="r-txn-ref">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">Mã đơn hàng</span>
                <span class="result-value" id="r-order-id">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">Số tiền</span>
                <span class="result-value" id="r-amount">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">Ngân hàng</span>
                <span class="result-value" id="r-bank">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">Thời gian</span>
                <span class="result-value" id="r-time">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">Khách hàng</span>
                <span class="result-value" id="r-name">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">Bàn đặt</span>
                <span class="result-value" id="r-table">—</span>
            </div>
        </div>

        <div id="result-actions" style="display:none; flex-direction:column; gap:0.8rem; margin-top:1.5rem;">
            <!-- Nút thay đổi theo kết quả — inject bằng JS -->
        </div>

    </div>
</div>

<script src="../script/main.js" onerror="void(0)"></script>
<script src="../script/payment-result.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init("p5WbWycfax30lGyWM");</script>
</body>
</html>
