<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.title">Kết Quả Thanh Toán - Celesté House</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/payment-custom.css">
    <style>
      .lang-switcher-nav {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        margin-left: 10px;
      }
      .btn-lang {
        background: transparent;
        border: 1px solid #c5a880;
        color: #fff;
        padding: 8px 16px;
        cursor: pointer;
        font-family: 'Montserrat', sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 1px;
        border-radius: 30px;
        transition: all 0.3s ease;
      }
      .btn-lang:hover, .btn-lang.active-lang {
        background: #c5a880;
        color: #000;
      }
    </style>
</head>
<body>

<nav>
    <div class="logo">CELESTÉ HOUSE</div>
    <ul class="nav-links">
        <li><a href="../index.html" data-i18n="navbar.nav_home">Trang Chủ</a></li>
        <li><a href="./menu.html" data-i18n="navbar.nav_menu">Thực Đơn</a></li>
        <li><a href="./team.html" data-i18n="navbar.nav_team">Nhà Hàng</a></li>
        <li><a href="./booking.html" data-i18n="navbar.nav_booking">Đặt Bàn</a></li>
        <li><a href="./blog.html" data-i18n="navbar.nav_blog">Blog</a></li>
        <li><a href="./contact.html" data-i18n="navbar.nav_contact">Liên Hệ</a></li>
        <li>
            <div class="lang-switcher-nav">
                <button id="btn-vi" class="btn-lang" onclick="changeLanguage('vi')">VI</button>
                <button id="btn-en" class="btn-lang" onclick="changeLanguage('en')">EN</button>
            </div>
        </li>
    </ul>
</nav>

<div class="progress-bar-wrap">
    <div class="progress-steps">
        <div class="step done">
            <div class="step-num"><span class="material-symbols-outlined" style="font-size:13px">check</span></div>
            <span data-i18n="page.step_info">Thông tin</span>
        </div>
        <div class="step-line done"></div>
        <div class="step done">
            <div class="step-num"><span class="material-symbols-outlined" style="font-size:13px">check</span></div>
            <span data-i18n="page.step_table">Chọn bàn</span>
        </div>
        <div class="step-line done"></div>
        <div class="step done">
            <div class="step-num"><span class="material-symbols-outlined" style="font-size:13px">check</span></div>
            <span data-i18n="page.step_payment">Thanh toán</span>
        </div>
        <div class="step-line done" id="step-line-4"></div>
        <div class="step active" id="step-4">
            <div class="step-num" id="step-4-num">4</div>
            <span data-i18n="page.step_confirm">Xác nhận</span>
        </div>
    </div>
</div>

<div class="result-container">
    <div class="result-card" id="result-card">

        <div class="result-icon" id="result-icon">
            <span class="material-symbols-outlined" id="result-icon-symbol">hourglass_top</span>
        </div>

        <h2 class="result-title" id="result-title" data-i18n="page.status_processing">Đang xử lý...</h2>
        <p class="result-subtitle" id="result-subtitle" data-i18n="page.subtitle_processing">Vui lòng chờ trong giây lát.</p>

        <div class="result-details" id="result-details" style="display:none;">
            <div class="result-row">
                <span class="result-label" data-i18n="page.label_vnpay_id">Mã giao dịch VNPay</span>
                <span class="result-value" id="r-txn-ref">—</span>
            </div>
            <div class="result-row">
                <span class="result-label" data-i18n="page.label_order_id">Mã đơn hàng</span>
                <span class="result-value" id="r-order-id">—</span>
            </div>
            <div class="result-row">
                <span class="result-label" data-i18n="page.label_amount">Số tiền</span>
                <span class="result-value" id="r-amount">—</span>
            </div>
            <div class="result-row">
                <span class="result-label" data-i18n="page.label_bank">Ngân hàng</span>
                <span class="result-value" id="r-bank">—</span>
            </div>
            <div class="result-row">
                <span class="result-label" data-i18n="page.label_time">Thời gian</span>
                <span class="result-value" id="r-time">—</span>
            </div>
            <div class="result-row">
                <span class="result-label" data-i18n="page.label_customer">Khách hàng</span>
                <span class="result-value" id="r-name">—</span>
            </div>
            <div class="result-row">
                <span class="result-label" data-i18n="page.label_table">Bàn đặt</span>
                <span class="result-value" id="r-table">—</span>
            </div>
        </div>

        <div id="result-actions" style="display:none; flex-direction:column; gap:0.8rem; margin-top:1.5rem;">
        </div>

    </div>
</div>

<!-- ① i18n.js PHẢI load TRƯỚC payment-result.js -->
<script src="../script/i18n.js" onerror="void(0)"></script>
<script src="../script/main.js" onerror="void(0)"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init("p5WbWycfax30lGyWM");</script>
<script src="../script/payment-result.js"></script>

<script>
    // ② Highlight nút ngôn ngữ đang active khi trang load
    (function syncLangButtons() {
        const lang = localStorage.getItem('selected_language') || localStorage.getItem('language') || 'vi';
        document.querySelectorAll('.btn-lang').forEach(btn => btn.classList.remove('active-lang'));
        const activeBtn = document.getElementById('btn-' + lang);
        if (activeBtn) activeBtn.classList.add('active-lang');
    })();

    // ③ Override changeLanguage để reload lại trang cập nhật dữ liệu động chính xác
    document.addEventListener('DOMContentLoaded', function() {
        window.changeLanguage = function(lang) {
            localStorage.setItem('selected_language', lang);
            localStorage.setItem('language', lang);
            
            // Reload lại trang để payment-result.js tính toán lại text chuẩn theo ngôn ngữ mới
            window.location.reload();
        };
    });
</script>

</body>
</html>
