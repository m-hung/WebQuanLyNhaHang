<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực Đơn - Celesté House</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../style/style.css" />
    <link rel="stylesheet" href="../style/menuStyle.css" />
    <style>
      /* CSS đồng bộ giao diện cụm nút ngôn ngữ giống file index.html */
      .lang-switcher-nav {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        margin-left: 10px;
      }
      .btn-lang {
        background: transparent;
        border: 1px solid #c5a880; /* Viền khung màu vàng Gold đặc trưng */
        color: #fff;
        padding: 8px 16px;
        cursor: pointer;
        font-family: 'Montserrat', sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 1px;
        border-radius: 30px; /* Bo tròn góc sang trọng */
        transition: all 0.3s ease;
      }
      .btn-lang:hover, .btn-lang.active-lang {
        background: #c5a880; 
        color: #000;
      }
    </style>
  </head>
  <body>
    <header class="menu-hero">
      <nav>
        <div class="logo">CELESTÉ HOUSE</div>
        <button class="menu-toggle" id="mobile-menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <ul class="nav-links">
          <li><a href="../index.html" data-i18n="navbar.nav_home">Trang Chủ</a></li>
          <li><a href="./menu.html" class="active" data-i18n="navbar.nav_menu">Thực Đơn</a></li>
          <li><a href="./team.html" data-i18n="navbar.nav_team">Nhà Hàng</a></li>
          <li><a href="./booking.html" data-i18n="navbar.nav_booking">Đặt Bàn</a></li>
          <li><a href="./blog.html" data-i18n="navbar.nav_blog">Blog</a></li>
          <li><a href="./contact.html" data-i18n="navbar.nav_contact">Liên Hệ</a></li>
          <li>
            <div class="lang-switcher-nav">
              <button class="btn-lang" onclick="changeLanguage('vi')">VI</button>
              <button class="btn-lang" onclick="changeLanguage('en')">EN</button>
            </div>
          </li>
        </ul>
      </nav>
      <div class="hero-content">
        <h1 data-i18n="page.hero_title">Thực Đơn Tinh Hoa</h1>
        <p data-i18n="page.hero_subtitle">Khám phá nghệ thuật ẩm thực Châu Âu giữa lòng thành phố</p>
        <div class="gold-line-center"></div>
      </div>
    </header>

    <div class="filter-section">
      <div class="search-container">
        <i class="fas fa-search search-icon"></i>
        <input
          type="text"
          id="menu-search"
          data-i18n="page.search_placeholder"
          placeholder="Bạn đang tìm món ăn nào?"
        />
      </div>

      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all" data-i18n="page.filter_all">Tất Cả</button>
      </div>
    </div>

    <section class="menu-display">
      <div class="menu-grid" id="main-menu-grid">
        </div>
    </section>

    <footer class="cta-section">
      <h2 data-i18n="page.footer_title">Sẵn Sàng Cho Một Bữa Tối Tuyệt Vời?</h2>
      <a href="./booking.html" class="btn-primary-gold" data-i18n="page.btn_book_now">Đặt Bàn Ngay</a>
    </footer>

    <script src="../script/i18n.js"></script>
    <script src="../script/script.js"></script>
    <script src="../script/menu.js"></script>
    <script src="../script/main.js"></script>
  </body>
</html>
